# Enable JUnit 5 parallel execution; individual tests opt in via @Execution(CONCURRENT).
# Default is same_thread so existing integration tests are unaffected.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=same_thread
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1

# Jazzer (WriteReadFuzzIntegrationTest): instrument only this project's classes for coverage,
# not Arrow, vortex-jni or the test libraries on the classpath.
jazzer.instrument=io.github.dfa1.vortex.**
