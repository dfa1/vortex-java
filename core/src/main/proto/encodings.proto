syntax = "proto3";

package vortex.encodings;

option java_package = "io.github.dfa1.vortex.core.proto";
option java_outer_classname = "EncodingProtos";

import "scalar.proto";
import "dtype.proto";

message PatchesMetadata {
  uint64 len = 1;
  uint64 offset = 2;
  vortex.dtype.PType indices_ptype = 3;
  optional uint64 chunk_offsets_len = 4;
  optional vortex.dtype.PType chunk_offsets_ptype = 5;
  optional uint64 offset_within_chunk = 6;
}

message SparseMetadata {
  PatchesMetadata patches = 1;
}

message DictMetadata {
  uint32 values_len = 1;
  vortex.dtype.PType codes_ptype = 2;
  optional bool is_nullable_codes = 3;
  optional bool all_values_referenced = 4;
}

message RunEndMetadata {
  vortex.dtype.PType ends_ptype = 1;
  uint64 num_runs = 2;
  uint64 offset = 3;
}

message ALPMetadata {
  uint32 exp_e = 1;
  uint32 exp_f = 2;
  optional PatchesMetadata patches = 3;
}

message BitPackedMetadata {
  uint32 bit_width = 1;
  uint32 offset = 2;
  optional PatchesMetadata patches = 3;
}

message SequenceMetadata {
  vortex.scalar.ScalarValue base = 1;
  vortex.scalar.ScalarValue multiplier = 2;
}

message VarBinMetadata {
  vortex.dtype.PType offsets_ptype = 1;
}

message FSSTMetadata {
  vortex.dtype.PType uncompressed_lengths_ptype = 1;
  vortex.dtype.PType codes_offsets_ptype = 2;
}

message DeltaMetadata {
  uint64 deltas_len = 1;
  uint32 offset = 2;
}

message DecimalMetadata {
  // DecimalType: I8=0, I16=1, I32=2, I64=3, I128=4, I256=5
  int32 values_type = 1;
}

message DecimalBytePartsMetadata {
  vortex.dtype.PType zeroth_child_ptype = 1;
  uint32 lower_part_count = 2;
}

message DateTimePartsMetadata {
  vortex.dtype.PType days_ptype = 1;
  vortex.dtype.PType seconds_ptype = 2;
  vortex.dtype.PType subseconds_ptype = 3;
}

message ZstdFrameMetadata {
  uint64 uncompressed_size = 1;
  uint64 n_values = 2;
}

message ZstdMetadata {
  uint32 dictionary_size = 1;
  repeated ZstdFrameMetadata frames = 2;
}

message RLEMetadata {
  uint64 values_len = 1;
  uint64 indices_len = 2;
  vortex.dtype.PType indices_ptype = 3;
  uint64 values_idx_offsets_len = 4;
  vortex.dtype.PType values_idx_offsets_ptype = 5;
  uint64 offset = 6;
}

message ListMetadata {
  uint64 elements_len = 1;
  vortex.dtype.PType offset_ptype = 2;
}

message ListViewMetadata {
  uint64 elements_len = 1;
  vortex.dtype.PType offset_ptype = 2;
  vortex.dtype.PType size_ptype = 3;
}

message ALPRDMetadata {
  uint32 right_bit_width = 1;
  uint32 dict_len = 2;
  repeated uint32 dict = 3;
  vortex.dtype.PType left_parts_ptype = 4;
  optional PatchesMetadata patches = 5;
}

message PcoPageInfo {
  uint32 n_values = 1;
}

message PcoChunkInfo {
  repeated PcoPageInfo pages = 1;
}

message PcoMetadata {
  bytes header = 1;
  repeated PcoChunkInfo chunks = 2;
}

message PatchedMetadata {
  uint32 n_patches = 1;
  uint32 n_lanes = 2;
  uint32 offset = 3;
}

message VariantMetadata {
  optional vortex.dtype.DType shredded_dtype = 1;
}
