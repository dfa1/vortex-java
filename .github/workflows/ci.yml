name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: [ '25', '26' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Azul Zulu JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ matrix.java-version }}

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install protobuf compiler
        run: sudo apt-get install -y protobuf-compiler

      - name: Install flatc 25.12.19
        run: |
          curl -fsSL -o flatc.zip https://github.com/google/flatbuffers/releases/download/v25.12.19/Linux.flatc.binary.g++-13.zip
          unzip -j flatc.zip flatc
          sudo install -m 755 flatc /usr/local/bin/flatc
          flatc --version

      - name: Build and test
        run: ./mvnw verify
