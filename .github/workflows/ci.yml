name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java-version: [ '25', '26' ]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Azul Zulu JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ matrix.java-version }}

      - name: Cache Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # vortex-jni has no Windows binary on Maven Central; skip the modules that
      # depend on it (integration, performance) when running on Windows.
      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: ./mvnw verify

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ./mvnw verify -pl '!integration,!performance'
